# Создайте .env рядом с этим файлом: OPENAI_API_KEY=sk-...
# env_file кладёт переменные в контейнер. DB_HOST/DB_PORT ниже переопределяют localhost из .env для доступа к postgres.
services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: postgres
      # Внутри Docker-сети Postgres слушает 5432; с хоста — см. ports у postgres (5434:5432)
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: marketplace
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      AES_KEY: ${AES_KEY:-0123456789abcdef0123456789abcdef}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: marketplace
      # OpenAI: берутся из env_file .env (не используйте OPENAI_API_KEY: ${...:-} — пустая подстановка затирала ключ)
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"

volumes:
  postgres_data:
  minio_data:
